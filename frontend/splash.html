<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 爬虫</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 480px;
      height: 320px;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    }
    .splash {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #3B82F6 0%, #1E40AF 100%);
      color: #ffffff;
      border-radius: 12px;
      box-sizing: border-box;
      padding: 24px;
      text-align: center;
    }
    .splash__logo {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 16px;
    }
    .splash__title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .splash__subtitle {
      font-size: 13px;
      opacity: 0.85;
      margin-bottom: 32px;
    }
    .splash__spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.35);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="splash" role="status" aria-live="polite">
    <div class="splash__logo">AI</div>
    <div class="splash__title">AI 爬虫</div>
    <div class="splash__subtitle">正在准备您的工具…</div>
    <div class="splash__spinner" aria-hidden="true"></div>
  </div>
</body>
</html>
